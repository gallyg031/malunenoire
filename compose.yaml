# Développement local.
#   docker compose run --rm tests        # pytest -q contre un Postgres jetable
#   docker compose up app                # http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lune
      POSTGRES_PASSWORD: lune
      POSTGRES_DB: lune
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lune"]
      interval: 2s
      retries: 20

  tests:
    build:
      context: .
      target: dev
    volumes: [".:/w"]
    environment:
      TEST_DATABASE_URL: postgresql://lune:lune@db:5432/lune
    depends_on:
      db: {condition: service_healthy}
    command: pytest -q

  app:
    build:
      context: .
    environment:
      ENV: local
      DATABASE_URL: postgresql://lune:lune@db:5432/lune
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
