<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ sujet }}</title></head>
<body style="margin:0;padding:0;background:#07080b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#07080b;">
<tr><td align="center" style="padding:40px 20px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;">
<tr><td align="center" style="padding-bottom:34px;font-family:Georgia,serif;font-size:11px;letter-spacing:5px;color:#9a958a;">{{ ui.marque }}</td></tr>
{%- for p in paragraphes %}
<tr><td style="padding-bottom:18px;font-family:'Cormorant Garamond',Georgia,serif;font-size:{% if loop.first %}22px{% else %}18px{% endif %};line-height:1.5;color:{% if loop.first %}#e9e4d6{% else %}#ddd7c8{% endif %};">{{ p }}</td></tr>
{%- endfor %}
<tr><td style="padding:14px 0 40px;"><a href="{{ lien }}" style="font-family:Georgia,serif;font-size:12px;letter-spacing:3px;color:#c0a96e;text-decoration:none;border-bottom:1px solid #8a8576;">{{ ui.emails.relire | upper }} →</a></td></tr>
<tr><td style="border-top:1px solid #2c2e38;padding-top:18px;font-family:Helvetica,Arial,sans-serif;font-size:11px;line-height:1.6;color:#8a8da0;">{{ ui.emails.pied }}<br><a href="{{ desinscription }}" style="color:#8a8da0;">{{ ui.emails.desinscrire }}</a></td></tr>
</table>
</td></tr>
</table>
</body>
</html>
