<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block titre %}{{ ui.titre_site }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ ui.entree.description }}{% endblock %}">
<meta name="theme-color" content="#07080b">
{% block meta %}{% endblock %}
<link rel="preload" href="/static/fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/marcellus-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/site.css?v={{ version }}">
<link rel="icon" href="/static/sceau.svg" type="image/svg+xml">
</head>
<body class="{% block classe %}{% endblock %}"{% block data %}{% endblock %}>
{% if brouillon %}<div class="bandeau-brouillon">{{ ui.brouillon }}</div>{% endif %}
<div class="colonne">
{% block contenu %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
