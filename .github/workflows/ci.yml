# Spec 06 §8, adapté : chaque push → tests ; tag v* → image → production.
# La préproduction arrivera avec Cloudflare (preprod.malunenoire.fr).
# Variables du dépôt : GCP_PROJECT, GCP_WIF_PROVIDER, GCP_SA (Workload Identity, sans clé JSON).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/malunenoire/app

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm tests

  deploy:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - run: |
          docker build -t $IMAGE:${{ github.ref_name }} .
          docker push $IMAGE:${{ github.ref_name }}
      - name: Cloud Run
        run: |
          gcloud run deploy malunenoire --image $IMAGE:${{ github.ref_name }} --region $REGION \
            --cpu 1 --memory 512Mi --concurrency 40 --min-instances 0 --max-instances 4 \
            --set-env-vars ENV=prod \
            --set-secrets DATABASE_URL=database-url-prod:latest \
            --allow-unauthenticated --quiet
      - name: Sonde
        run: |
          URL=$(gcloud run services describe malunenoire --region $REGION --format 'value(status.url)')
          curl -fsS "$URL/health"
